# ============================================================
# pyproject.toml
# ============================================================

# ============================================================
# SECTION 1: PROJECT IDENTITY (name, version, dependencies)
# ============================================================

[project]
name = "penguins-body-mass"
readme = "README.md"
requires-python = ">=3.14,<3.15"
version = "0.0.1"
description = "Reproducible machine-learning experiments for predicting penguin body mass."
license-files = ["LICENSE"]
authors = [
    { name = "Denise Case" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
keywords = [
    "machine-learning",
    "regression",
    "supervised-learning",
    "penguins",
    "palmer-penguins",
    "body-mass",
    "linear-regression",
    "model-evaluation",
    "experiment-design",
    "reproducible-analytics",
]

dependencies = [
    "composable_data_core", # WHY: Core decision grammar.
    "datafun_toolkit", # WHY: privacy preserving logging.
    "ml-vizkit", # WHY: Core ML visualization toolkit for model evaluation and analysis.
    "matplotlib", # WHY: Core plotting library for visualizations.
    "numpy", # WHY: Core numerical computing library for array operations and linear algebra.
    "pandas", # WHY: Core data manipulation library for tabular data.
    "scikit-learn", # WHY: Core ML library for model training and evaluation. Requires 3.14.
    "seaborn", # WHY: Core statistical data visualization library for enhanced plots.
]

[dependency-groups]
# WHY: Development dependencies support maintaining and validating the project
# but are not runtime dependencies or optional features of the published package.

dev = [
    # REQ.DEV.DEPS: External packages used for linting, testing, type checking, etc.
    "pre-commit", # WHY: Pre-commit hooks for consistent formatting and linting.
    "pytest",     # WHY: Test framework for unit and integration tests.
    "pytest-cov", # WHY: Test coverage reporting for quality metrics and CI gating.
    "ruff",       # WHY: Fast linting and formatting for Python code.
    "ty",         # WHY: Type checking for static analysis and type safety.
]

docs = [
    # REQ.DOCS.DEPS: External packages used to generate project documentation.
    "zensical",
    "mkdocstrings[python]", # WHY: Auto-generate API docs from docstrings.
]

[project.urls]
Homepage = "https://github.com/applied-models/penguins-body-mass"
Repository = "https://github.com/applied-models/penguins-body-mass"
Documentation = "https://applied-models.github.io/penguins-body-mass/"
Issues = "https://github.com/applied-models/penguins-body-mass/issues"
Changelog = "https://github.com/applied-models/penguins-body-mass/blob/main/CHANGELOG.md"

# ============================================================
# SECTION 2: TOOL CONFIGURATION
# ============================================================

# === PYTEST ===

[tool.pytest.ini_options]
# WHY: Consistent test discovery and coverage visibility.
minversion = "9.0"
testpaths = ["tests"]
addopts = "--cov=penguins_body_mass --cov-fail-under=25 --cov-report=term-missing"

# === RUFF ===

[tool.ruff]
# WHY: Use one fast tool for Python linting and formatting across maintained repos.
# WHY: Keep generated, cached, virtualenv, build, and docs-site output out of lint scope.
exclude = [
    ".eggs",
    "*.egg-info",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "site",
]
# WHY: Match Black/Ruff formatter default; keeps diffs compact and predictable.
line-length = 88

# WHY: Avoid unstable preview behavior unless a repo intentionally opts in.
preview = false

# WHY: Match the current repo target; modernization rules should track the supported runtime.
target-version = "py314"

# WHY: Do not apply fixes Ruff marks unsafe in shared/release-oriented repos.
unsafe-fixes = false


[tool.ruff.format]
# WHY: Spaces are the Python standard and match formatter defaults.
indent-style = "space"

# WHY: Preserve platform-appropriate line endings across Windows/macOS/Linux contributors.
line-ending = "auto"

# WHY: Preserve existing quote style to minimize meaningless diff churn.
quote-style = "preserve"


[tool.ruff.lint]
# WHY: Professional baseline for research, package, and infrastructure code.
# WHY: Catch correctness issues, import disorder, modernization drift, bug patterns,
# WHY: path handling problems, avoidable complexity, weak return flow, doc gaps,
# WHY: and obvious security hazards.
select = [
    "E",   # WHY: Basic syntax and structural correctness.
    "F",   # WHY: Undefined names, unused imports, and likely real errors.
    "W",   # WHY: Warnings that catch easy issues early.
    "I",   # WHY: Deterministic import ordering for stable diffs.
    "UP",  # WHY: Modern Python constructs for the pinned Python version.
    "B",   # WHY: Common bug patterns.

    "PTH", # WHY: Prefer pathlib for cross-platform path handling.
    "C4",  # WHY: Comprehension correctness and clarity.
    "SIM", # WHY: Remove obvious unnecessary complexity.
    "RET", # WHY: Keep return behavior explicit and readable.

    "D",   # WHY: Public/reusable code needs docstrings.
    "S",   # WHY: Catch obvious security hazards before release or reuse.
]

ignore = [
    "E501", # WHY: Line length is handled by the formatter, not Ruff lint.
    "D203", # WHY: Conflicts with D211; use the no-blank-line convention.
    "D213", # WHY: Conflicts with D212; use first-line summary convention.
    "S101", # WHY: Allow assert for tests and intentional internal invariants.
]


[tool.ruff.lint.isort]
# WHY: Ordered imports keep reviews and generated diffs readable.
force-sort-within-sections = true


[tool.ruff.lint.per-file-ignores]
# WHY: Package __init__ files often re-export public API names.
"src/**/__init__.py" = ["F401"]

# WHY: Tests prioritize behavior clarity over public API documentation.
# WHY: B011/B018 may be acceptable in tests depending on the assertion pattern.
# WHY: S101 is retained here even though it is also globally ignored.
"tests/**/*.py" = ["D", "B018", "B011", "S101"]

# WHY: Marker files are intentionally empty/non-Python content.
"src/**/py.typed" = ["ALL"]

[tool.ruff.lint.pydocstyle]
# REQ: Google style is the project-wide docstring convention.
convention = "google"

# === UV ===

[tool.uv]
# WHY: Install all dependency groups defined by this repository by default.
# This keeps the canonical setup command identical across project types while
# allowing each repository to declare only the tooling it actually needs.
default-groups = "all"

# ============================================================
# SECTION 3: BUILD SYSTEM
# ============================================================
#
# REQ.PROJECT: A build system MUST be declared for package discovery and publishing.
# REQ.STRUCTURE: All importable code MUST live under src/.
# WHY src/ layout: Prevents accidental imports from the repo root and ensures
# consistent behavior across IDEs, tests, CI, and PyPI.

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/penguins_body_mass"]
